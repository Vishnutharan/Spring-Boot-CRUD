# Application Name
spring.application.name=CrudApplication

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Employee}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update         
spring.jpa.show-sql=true                    
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect   # MySQL 8 specific dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
